name: Publish UI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'warps/**/*.tsx'
      - 'warps/**/*.css'
      - 'warps/**/*.ts'
      - 'warps/**/warp.json'
      - 'ui/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build UIs
      run: npm run build

    - name: Commit and Push changes
      id: commit
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        if git diff --staged --quiet; then exit 0; fi
        git commit -m "chore: build and update UI artifacts [skip ci]"
        git pull --rebase
        git push
        echo "pushed=true" >> "$GITHUB_OUTPUT"

    - name: Trigger catalog sync
      if: steps.commit.outputs.pushed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run sync-catalog.yml --ref "${{ github.ref_name }}"
